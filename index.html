      abstract: "Vision\u2013Language Models (VLMs) are increasingly deployed through a model supply chain in which pretrained checkpoints, architecture definitions, text encoders, and exported computation graphs are distributed by third parties and reused across downstream services. This reuse model creates a security-critical trust boundary: VLM deployments inherit not only learned parameters but also executable behavior encoded in shared model artifacts. In this paper, we show that a malicious provider can exploit this trust boundary by embedding architectural backdoors into VLM supply chains through representation steering. Our attack introduces dormant steering logic into the model architecture through a trigger-gated additive modification of an intermediate representation, without poisoning training data, controlling downstream fine-tuning, or modifying prompts at deployment time. When the trigger is absent, the modification reduces to zero and the model follows its normal computation, preserving clean utility. When the trigger is present, a steering direction shifts the internal representation toward an attacker-defined objective. We evaluate the attack across multiple VLM families, including CLIP, BLIP, T5, LLaVA, Qwen3-VL, and diffusion-based architectures, and across multiple downstream tasks, including visual question answering, text-to-image generation, retrieval, and semantic response biasing, showing that the same architectural steering primitive compromises integrity, safety enforcement, and ranking fairness while preserving normal behavior on clean inputs. These results show that shared VLM artifacts can carry dormant steering logic that acts as an architectural backdoor against downstream services. Representation steering is a practical architectural backdoor payload for VLM supply chains, and securing VLM deployments requires auditing the executable logic distributed with model artifacts, rather than only their weights."

.pub-abs{margin:0.65rem 0 0}
.pub-abs summary{
  list-style:none;cursor:pointer;color:var(--teal);font-size:0.875rem;
  display:inline-flex;align-items:center;gap:0.4rem;
}
.pub-abs summary::-webkit-details-marker{display:none}
.pub-abs summary:hover{text-decoration:underline;text-underline-offset:3px}
.chev{display:inline-block;transition:transform .18s ease;font-size:0.75rem}
.pub-abs[open] .chev{transform:rotate(90deg)}
.pub-abs p{margin:0.65rem 0 0;color:var(--ink-soft);max-width:var(--measure);font-size:0.9375rem}
.pub-flash{background:color-mix(in srgb,var(--wine) 9%,transparent)}

/* ---------- background ---------- */
.bg-list{display:grid;gap:1.5rem;margin:0;padding:0;list-style:none}
.bg-item{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:0 1.5rem}
.bg-p{font-size:0.8125rem;color:var(--ink-soft);padding-top:0.2rem}
.bg-t{font-weight:600;margin:0}
.bg-o{font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin:0.1rem 0 0}
.bg-n{color:var(--ink-soft);font-size:0.9375rem;margin:0.35rem 0 0;max-width:var(--measure)}

.mini{list-style:none;margin:2.5rem 0 0;padding:0;display:grid;gap:0.5rem;font-size:0.9375rem}
.mini-h{font-weight:600;font-size:0.875rem;margin:0 0 0.75rem;color:var(--ink)}
.mini li{display:grid;grid-template-columns:4rem minmax(0,1fr);gap:1.5rem;color:var(--ink-soft)}

/* ---------- code ---------- */
.repos{list-style:none;margin:0;padding:0}
.repo{border-top:1px solid var(--rule);padding-block:1rem}
.repo:last-child{border-bottom:1px solid var(--rule)}
.repo-t{display:flex;flex-wrap:wrap;gap:0.3rem 1rem;align-items:baseline}
.repo-n{font-weight:600;font-size:1rem;color:var(--ink);text-decoration:none}
.repo-n:hover{color:var(--teal);text-decoration:underline}
.repo-m{font-size:0.75rem;color:var(--ink-soft);display:flex;gap:1rem;margin-left:auto}
.repo-d{margin:0.3rem 0 0;color:var(--ink-soft);font-size:0.9375rem;max-width:var(--measure)}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:2rem;align-items:start}
.contact-note{color:var(--ink-soft);max-width:44ch;margin:0}
.elsewhere{list-style:none;margin:0;padding:0;display:grid;gap:0.55rem}
.el-l{font-size:0.75rem;color:var(--ink-soft);display:inline-block;min-width:6rem}

.foot{padding-block:2rem 3rem;font-size:0.75rem;color:var(--ink-soft);border-top:1px solid var(--rule)}
.foot p{margin:0}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-block:2rem 2.5rem;gap:2.5rem}
  .disk-holder{order:-1;max-width:15rem}
  .pub{grid-template-columns:1fr;gap:0}
  .pub-yr{padding:0 0 0.3rem}
  .bg-item{grid-template-columns:1fr}
  .bg-p{padding:0 0 0.2rem}
  .repo-m{margin-left:0;width:100%}
  .mini li{grid-template-columns:3.5rem minmax(0,1fr);gap:1rem}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .drawing .geo{animation:none;stroke-dasharray:none}
  .chev{transition:none}
  .disk{cursor:default}
  .pub{transition:none}
}

@media print{
  .nav,.disk-holder,.foot{display:none}
  .band{background:none;border:0}
  .pub-abs{display:none}
  body{background:#fff;color:#000;font-size:10pt}
}
</style>
</head>

<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="sig" id="sig" href="#top">M. R. Briglia</a>
    <nav class="nav" aria-label="Sections">
      <a href="#research">Research</a>
      <a href="#publications">Publications</a>
      <a href="#background">Background</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="top">

  <section class="wrap hero">
    <div>
      <h1 class="hname" id="hname"></h1>
      <p class="hrole" id="hrole"></p>
      <div class="hstate" id="hstate"></div>
      <p class="hmeta" id="hmeta"></p>
    </div>

    <figure class="disk-holder">
      <svg class="disk" id="disk" viewBox="-1.08 -1.08 2.16 2.16" role="img"
           aria-label="A Poincaré disk: geodesics of the hyperbolic plane, drawn as circular arcs that meet the boundary at right angles.">
        <circle class="disk-fill" cx="0" cy="0" r="1"></circle>
        <g id="geos"></g>
        <circle class="disk-edge" cx="0" cy="0" r="1"></circle>
      </svg>
      <figcaption class="disk-cap" id="diskCap">The Poincaré disk. Drag it.</figcaption>
    </figure>
  </section>

  <section class="band" id="research">
    <div class="wrap sec">
      <h2 class="sec-h">Research</h2>
      <p class="sec-sub">Four threads, with the papers that belong to each.</p>
      <div class="themes" id="themes"></div>
    </div>
  </section>

  <section class="wrap sec" id="publications">
    <h2 class="sec-h">Publications</h2>
    <p class="sec-sub" id="pubSub"></p>
    <div id="pubs"></div>
  </section>

  <section class="band" id="background">
    <div class="wrap sec">
      <h2 class="sec-h">Background</h2>
      <p class="sec-sub">Education, and the research position that came before the PhD.</p>
      <ul class="bg-list" id="bgList"></ul>
      <div id="extras"></div>
    </div>
  </section>

  <section class="wrap sec" id="code" hidden>
    <h2 class="sec-h">Code</h2>
    <p class="sec-sub">Public repositories, newest first.</p>
    <ul class="repos" id="repos"></ul>
  </section>

  <section class="wrap sec" id="contact">
    <h2 class="sec-h">Contact</h2>
    <div class="contact-grid">
      <p class="contact-note" id="contactNote"></p>
      <ul class="elsewhere" id="elsewhere"></ul>
    </div>
  </section>

</main>

<footer class="wrap foot">
  <p id="foot"></p>
</footer>

<script>
(function () {
  "use strict";

  var S = window.SITE || {};
  var SVGNS = "http://www.w3.org/2000/svg";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(id) { return document.getElementById(id); }
  function make(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (txt !== undefined) { n.textContent = txt; }
    return n;
  }
  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  }

  /* =============== head + hero =============== */

  document.title = S.name || "";
  el("hname").textContent = S.name || "";
  el("sig").textContent = S.shortName || S.name || "";
  el("hrole").textContent = (S.role || "") + (S.affiliation ? ", " + S.affiliation : "");

  var hstate = el("hstate");
  (S.statement || []).forEach(function (p) { hstate.appendChild(make("p", null, p)); });

  var hmeta = el("hmeta");
  if (S.location) { hmeta.appendChild(make("span", null, S.location)); }
  if (S.email) {
    var mail = make("a", null, S.email);
    mail.href = "mailto:" + S.email;
    hmeta.appendChild(mail);
  }
  if (S.links && S.links.cv) {
    var cv = make("a", null, "Curriculum vitae");
    cv.href = S.links.cv;
    hmeta.appendChild(cv);
  }

  /* =============== Poincare disk ===============
     Geodesics of the hyperbolic plane are circular arcs orthogonal to the
     boundary circle. For ideal endpoints p and q on the unit circle, the
     arc's centre is (p + q) / (1 + p.q) and its radius r satisfies
     |c|^2 = 1 + r^2. Dragging applies the Mobius isometry
     z -> (z + a) / (1 + conj(a).z), which moves the ideal endpoints while
     preserving the hyperbolic structure.
  */

  var N_IDEAL = 16;
  var STEPS = [5, 7];
  var paths = [];
  var pairs = [];

  STEPS.forEach(function (step, band) {
    for (var i = 0; i < N_IDEAL; i++) {
      pairs.push({ a: i, b: (i + step) % N_IDEAL, band: band });
    }
  });

  function mobius(z, a) {
    var nRe = z[0] + a[0];
    var nIm = z[1] + a[1];
    var dRe = 1 + (a[0] * z[0] + a[1] * z[1]);
    var dIm = a[0] * z[1] - a[1] * z[0];
    var den = dRe * dRe + dIm * dIm;
    if (den < 1e-12) { return z; }
    return [(nRe * dRe + nIm * dIm) / den, (nIm * dRe - nRe * dIm) / den];
  }

  function straight(p1, p2) {
    return "M" + p1[0].toFixed(4) + " " + p1[1].toFixed(4) +
           "L" + p2[0].toFixed(4) + " " + p2[1].toFixed(4);
  }

  function arcPath(p1, p2) {
    var dot = p1[0] * p2[0] + p1[1] * p2[1];
    if (Math.abs(1 + dot) < 1e-4) { return straight(p1, p2); }

    var cx = (p1[0] + p2[0]) / (1 + dot);
    var cy = (p1[1] + p2[1]) / (1 + dot);
    var r2 = cx * cx + cy * cy - 1;
    if (r2 <= 0) { return straight(p1, p2); }

    var r = Math.sqrt(r2);
    var a1 = Math.atan2(p1[1] - cy, p1[0] - cx);
    var a2 = Math.atan2(p2[1] - cy, p2[0] - cx);
    var d = a2 - a1;
    while (d > Math.PI) { d -= 2 * Math.PI; }
    while (d < -Math.PI) { d += 2 * Math.PI; }

    var out = "";
    var SEG = 18;
    for (var i = 0; i <= SEG; i++) {
      var t = a1 + d * (i / SEG);
      out += (i === 0 ? "M" : "L") +
             (cx + r * Math.cos(t)).toFixed(4) + " " +
             (cy + r * Math.sin(t)).toFixed(4);
    }
    return out;
  }

  function renderDisk(a) {
    var ideal = [];
    for (var i = 0; i < N_IDEAL; i++) {
      var t = (i / N_IDEAL) * Math.PI * 2;
      ideal.push(mobius([Math.cos(t), Math.sin(t)], a));
    }
    for (var k = 0; k < pairs.length; k++) {
      paths[k].setAttribute("d", arcPath(ideal[pairs[k].a], ideal[pairs[k].b]));
    }
  }

  (function initDisk() {
    var g = el("geos");
    var svg = el("disk");

    pairs.forEach(function (pr, i) {
      var p = document.createElementNS(SVGNS, "path");
      p.setAttribute("class", "geo" + (pr.band ? " geo-b" : ""));
      p.setAttribute("pathLength", "1");
      p.style.animationDelay = (i * 22) + "ms";
      g.appendChild(p);
      paths.push(p);
    });

    renderDisk([0, 0]);

    if (reduce) {
      el("diskCap").textContent = "The Poincaré disk: hyperbolic geodesics, meeting the boundary at right angles.";
      svg.style.touchAction = "auto";
      return;
    }

    requestAnimationFrame(function () { svg.classList.add("drawing"); });

    var target = [0, 0];
    var current = [0, 0];
    var ticking = false;
    var live = false;
    setTimeout(function () { live = true; }, 1300);

    function tick() {
      var dx = target[0] - current[0];
      var dy = target[1] - current[1];
      if (Math.abs(dx) < 0.0006 && Math.abs(dy) < 0.0006) {
        current[0] = target[0];
        current[1] = target[1];
        renderDisk(current);
        ticking = false;
        return;
      }
      current[0] += dx * 0.14;
      current[1] += dy * 0.14;
      renderDisk(current);
      requestAnimationFrame(tick);
    }

    function nudge() {
      if (!ticking) { ticking = true; requestAnimationFrame(tick); }
    }

    function aim(e) {
      if (!live) { return; }
      var r = svg.getBoundingClientRect();
      if (!r.width || !r.height) { return; }
      var x = ((e.clientX - r.left) / r.width) * 2 - 1;
      var y = ((e.clientY - r.top) / r.height) * 2 - 1;
      var m = Math.hypot(x, y);
      var cap = 0.6;
      if (m > cap) { x = (x / m) * cap; y = (y / m) * cap; }
      target = [x, y];
      nudge();
    }

    function release() { target = [0, 0]; nudge(); }

    svg.addEventListener("pointerdown", function (e) {
      if (svg.setPointerCapture) { svg.setPointerCapture(e.pointerId); }
      aim(e);
    });
    svg.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse" && e.buttons === 0) { return; }
      aim(e);
    });
    svg.addEventListener("pointerup", release);
    svg.addEventListener("pointercancel", release);
    svg.addEventListener("pointerleave", release);
  })();

  /* =============== publications =============== */

  var STATUS_LABEL = { submitted: "Under submission", preprint: "Preprint" };

  function pubId(title) { return "p-" + slug(title); }

  (function drawPubs() {
    var host = el("pubs");
    var pubs = S.publications || [];

    pubs.forEach(function (pub) {
      var art = make("article", "pub");
      art.id = pubId(pub.title);
      art.appendChild(make("div", "pub-yr", pub.year || ""));

      var body = make("div");
      body.appendChild(make("h3", "pub-t", pub.title));

      var v = make("p", "pub-v");
      if (pub.venue) { v.appendChild(make("span", null, pub.venue)); }
      var label = STATUS_LABEL[pub.status];
      if (label && pub.venue !== label) {
        v.appendChild(make("span", "tag tag-" + pub.status, label));
      }
      body.appendChild(v);

      if (pub.links && pub.links.length) {
        var ls = make("p", "pub-links");
        pub.links.forEach(function (l) {
          var a = make("a", null, l.label);
          a.href = l.url;
          a.rel = "noopener";
          ls.appendChild(a);
        });
        body.appendChild(ls);
      }

      if (pub.abstract) {
        var d = make("details", "pub-abs");
        var sm = make("summary");
        sm.appendChild(make("span", "chev", "\u203A"));
        sm.appendChild(make("span", null, "Abstract"));
        d.appendChild(sm);
        d.appendChild(make("p", null, pub.abstract));
        body.appendChild(d);
      }

      art.appendChild(body);
      host.appendChild(art);
    });

    var pending = pubs.filter(function (p) { return p.status === "submitted"; }).length;
    el("pubSub").textContent = pubs.length + " papers" +
      (pending ? ", " + (pubs.length - pending) + " out and " + pending + " under submission" : "") +
      ". Abstracts expand in place.";
  })();

  /* =============== research themes =============== */

  (function drawThemes() {
    var host = el("themes");
    var known = {};
    (S.publications || []).forEach(function (p) { known[p.title] = true; });

    (S.research || []).forEach(function (t) {
      var sec = make("div");
      sec.appendChild(make("h3", "theme-h", t.title));
      sec.appendChild(make("p", "theme-b", t.body));

      if (t.papers && t.papers.length) {
        var ul = make("ul", "theme-refs");
        t.papers.forEach(function (name) {
          var li = make("li");
          if (known[name]) {
            var b = make("button", null, name);
            b.type = "button";
            b.addEventListener("click", function () {
              var node = document.getElementById(pubId(name));
              if (!node) { return; }
              var d = node.querySelector(".pub-abs");
              if (d) { d.open = true; }
              node.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
              node.classList.add("pub-flash");
              setTimeout(function () { node.classList.remove("pub-flash"); }, 1600);
            });
            li.appendChild(b);
          } else {
            li.textContent = name;
          }
          ul.appendChild(li);
        });
        sec.appendChild(ul);
      }
      host.appendChild(sec);
    });
  })();

  /* =============== background =============== */

  (function drawBackground() {
    var host = el("bgList");
    (S.background || []).forEach(function (b) {
      var li = make("li", "bg-item");
      li.appendChild(make("div", "bg-p", b.period || ""));
      var d = make("div");
      d.appendChild(make("p", "bg-t", b.title));
      if (b.org) { d.appendChild(make("p", "bg-o", b.org)); }
      if (b.note) { d.appendChild(make("p", "bg-n", b.note)); }
      li.appendChild(d);
      host.appendChild(li);
    });

    var extras = el("extras");

    function miniBlock(heading, rows) {
      if (!rows.length) { return; }
      var ul = make("ul", "mini");
      ul.appendChild(make("p", "mini-h", heading));
      rows.forEach(function (r) {
        var li = make("li");
        li.appendChild(make("span", null, r.left));
        li.appendChild(make("span", null, r.right));
        ul.appendChild(li);
      });
      extras.appendChild(ul);
    }

    miniBlock("Summer schools", (S.schools || []).map(function (s) {
      return { left: s.year, right: s.name + (s.where ? ", " + s.where : "") };
    }));
    miniBlock("Teaching", (S.teaching || []).map(function (t) {
      return { left: t.period, right: t.title + (t.org ? ", " + t.org : "") };
    }));
    miniBlock("Service", (S.service || []).map(function (s) {
      return { left: s.year, right: s.text };
    }));
  })();

  /* =============== contact =============== */

  var SHAPES = {
    email:    { label: "Email",    href: function (v) { return "mailto:" + v; },                  show: function (v) { return v; } },
    scholar:  { label: "Scholar",  href: function (v) { return v; },                               show: function () { return "Google Scholar"; } },
    orcid:    { label: "ORCID",    href: function (v) { return "https://orcid.org/" + v; },        show: function (v) { return v; } },
    github:   { label: "GitHub",   href: function (v) { return "https://github.com/" + v; },       show: function (v) { return v; } },
    bluesky:  { label: "Bluesky",  href: function (v) { return "https://bsky.app/profile/" + v; }, show: function (v) { return "@" + v; } },
    linkedin: { label: "LinkedIn", href: function (v) { return "https://linkedin.com/in/" + v; },  show: function (v) { return "in/" + v; } },
    cv:       { label: "CV",       href: function (v) { return v; },                               show: function () { return "Curriculum vitae (PDF)"; } }
  };

  (function drawContact() {
    el("contactNote").textContent =
      "I'm glad to hear from anyone working on adversarial robustness, model safety, or the geometry of representation. Email is the surest way to reach me.";

    var host = el("elsewhere");
    var links = {};
    Object.keys(S.links || {}).forEach(function (k) { links[k] = S.links[k]; });
    if (S.email) { links.email = S.email; }

    ["email", "scholar", "orcid", "github", "bluesky", "linkedin", "cv"].forEach(function (key) {
      var v = links[key];
      if (!v) { return; }
      var shape = SHAPES[key];
      var li = make("li");
      li.appendChild(make("span", "el-l", shape.label));
      var a = make("a", null, shape.show(v));
      a.href = shape.href(v);
      if (a.href.indexOf("http") === 0) { a.rel = "me noopener"; }
      li.appendChild(a);
      host.appendChild(li);
    });

    var stamp = new Date(document.lastModified);
    var when = isNaN(stamp.getTime()) ? "" :
      " Last updated " + stamp.toLocaleDateString("en-GB", { year: "numeric", month: "long" }) + ".";
    el("foot").textContent = "\u00A9 " + new Date().getFullYear() + " " + (S.name || "") + "." + when;
  })();

  /* =============== optional: repos =============== */

  (function drawCode() {
    var user = (S.githubUser || "").trim();
    if (!user) { return; }

    fetch("https://api.github.com/users/" + user + "/repos?per_page=100&sort=updated")
      .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); })
      .then(function (all) {
        if (!Array.isArray(all)) { throw new Error("bad payload"); }
        var repos = all.filter(function (r) {
          return !r.fork && !r.archived && r.description;
        }).slice(0, 8);
        if (!repos.length) { return; }

        var host = el("repos");
        repos.forEach(function (r) {
          var li = make("li", "repo");
          var top = make("div", "repo-t");
          var a = make("a", "repo-n", r.name);
          a.href = r.html_url;
          a.rel = "noopener";
          top.appendChild(a);
          var m = make("div", "repo-m");
          if (r.language) { m.appendChild(make("span", null, r.language)); }
          if (r.stargazers_count) { m.appendChild(make("span", null, "\u2605 " + r.stargazers_count)); }
          top.appendChild(m);
          li.appendChild(top);
          li.appendChild(make("p", "repo-d", r.description));
          host.appendChild(li);
        });
        el("code").hidden = false;
      })
      .catch(function () { /* section stays hidden */ });
  })();
})();
</script>

</body>
</html>
